[project]
name = "potok51"
version = "1.0.0"
description = "Credit limit engine over 1C account 51 card"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "jinja2>=3.1",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
potok51 = "potok51.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["potok51*", "synth*"]

[tool.setuptools.package-data]
"potok51.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
